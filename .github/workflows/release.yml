name: "Release"

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.ref }}^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release, include all commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${{ github.ref }})
          else
            # Include commits since previous tag
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..${{ github.ref }})
          fi

          # Use multi-line output
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes-file <(echo "${{ steps.changelog.outputs.body }}")

  package-helm:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm 3.14
        uses: azure/setup-helm@v3
        with:
          version: "3.14"

      - name: Package Helm chart
        run: |
          helm package charts/openserve

      - name: Upload Helm chart to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} openserve-${{ github.ref_name }}.tgz

  update-helm-index:
    needs: package-helm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gh-pages

      - name: Install Helm 3.14
        uses: azure/setup-helm@v3
        with:
          version: "3.14"

      - name: Fetch latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.ref_name }} -p "openserve-*.tgz" --dir ./tmp

      - name: Update Helm index
        run: |
          # Initialize index if it doesn't exist
          if [ ! -f index.yaml ]; then
            helm repo index . --url https://openserve.github.io/openserve/
          else
            helm repo index . --url https://openserve.github.io/openserve/ --merge index.yaml
          fi

      - name: Commit and push index
        run: |
          git config user.name "openserve-bot"
          git config user.email "bot@openserve.dev"
          git add index.yaml
          git commit -m "Update Helm index for ${{ github.ref_name }}"
          git push
