name: "Security"

on:
  push:
    branches: [main]
  schedule:
    # Monday 00:00 UTC
    - cron: "0 0 * * 1"

permissions:
  security-events: write
  contents: read
  packages: write

jobs:
  codeql:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        language: [go, javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  govulncheck:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: operator
            go-version: "1.23"
          - module: apps/control-api
            go-version: "1.24"
          - module: apps/gateway
            go-version: "1.23"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Tidy module
        run: go mod tidy || true
        working-directory: ${{ matrix.module }}
        env:
          GONOSUMDB: "*"
          GOTOOLCHAIN: auto

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
        working-directory: ${{ matrix.module }}
        env:
          GOFLAGS: "-mod=mod"
          GONOSUMDB: "*"

  build-images:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        component: [operator, control-api, gateway, gui]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set Dockerfile path
        id: dockerfile
        run: |
          if [[ "${{ matrix.component }}" == "operator" ]]; then
            echo "path=operator/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=apps/${{ matrix.component }}/Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openserve-${{ matrix.component }}:sha-${{ github.sha }}

  trivy-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-images
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        component: [operator, control-api, gateway, gui]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/openserve-${{ matrix.component }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}
