---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openserve.fullname" . }}-control-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-api
spec:
  type: ClusterIP
  selector:
    {{- include "openserve.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openserve.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    {{- include "openserve.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openserve.fullname" . }}-gui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gui
spec:
  type: ClusterIP
  selector:
    {{- include "openserve.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gui
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openserve.fullname" . }}-operator-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  type: ClusterIP
  selector:
    {{- include "openserve.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
