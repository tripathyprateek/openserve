# Local development stack.
# Does NOT run the operator (it requires a real K8s cluster).
# All inference-side features (deploy model, scale-to-zero) are stubs in this mode.
#
# Usage:
#   cp .env.dev.example .env.dev
#   docker compose --env-file .env.dev up --build

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: openserve
      POSTGRES_USER: openserve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openserve_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openserve"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Control API ───────────────────────────────────────────────────────────
  control-api:
    build:
      context: .
      dockerfile: apps/control-api/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: postgres://openserve:${POSTGRES_PASSWORD:-openserve_dev}@postgres:5432/openserve?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-in-production}
      # DEV_EMAIL bypasses OIDC — remove this for production
      DEV_EMAIL: ${DEV_EMAIL:-dev@localhost}
      # OIDC configuration — defaults to Google if unset
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://accounts.google.com}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      # Deprecated Google-specific flags (kept for backward compatibility)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_HOSTED_DOMAIN: ${GOOGLE_HOSTED_DOMAIN:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    # distroless images have no shell/wget — healthcheck disabled for local dev.
    # The service is confirmed healthy when curl http://localhost:8080/healthz returns 200.

  # ── Gateway ───────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      POSTGRES_URL: postgres://openserve:${POSTGRES_PASSWORD:-openserve_dev}@postgres:5432/openserve?sslmode=disable
      REDIS_ADDR: redis:6379
      PEER_RELAY_INTERNAL_URL: http://peer-relay:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-vllm:
        condition: service_healthy
    volumes:
      # Routes llama-3-8b-instruct to the mock-vllm service.
      - ./hack/dev-routing.yaml:/config/routing.yaml:ro
    # distroless images have no shell/wget — healthcheck disabled for local dev.

  # ── Peer Relay ────────────────────────────────────────────────────────────
  peer-relay:
    build:
      context: .
      dockerfile: apps/peer-relay/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8080"   # public WS endpoint (peer agents connect here)
      # internal port 8081 is NOT exposed — only reachable by gateway within compose network
    environment:
      POSTGRES_URL: postgres://openserve:${POSTGRES_PASSWORD:-openserve_dev}@postgres:5432/openserve?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # ── Mock vLLM ─────────────────────────────────────────────────────────────
  # Simulates a vLLM inference backend for local development.
  # Responds to /health, /v1/chat/completions (SSE), /v1/models, and /metrics.
  # The gateway is configured (via dev-routing.yaml) to forward llama-3-8b-instruct
  # requests to this service.
  mock-vllm:
    build:
      context: .
      dockerfile: hack/Dockerfile.mock-vllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── GUI ───────────────────────────────────────────────────────────────────
  gui:
    build:
      context: .
      dockerfile: apps/gui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""   # empty = relative URLs, proxied through Nginx below
        NEXT_PUBLIC_GATEWAY_URL: "http://localhost:8081"
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server-side rewrite target — Next.js proxies /api/v1/* to this URL.
      # The browser only ever talks to localhost:3000; no CORS needed.
      CONTROL_API_URL: http://control-api:8080
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8081
    depends_on:
      - control-api

volumes:
  postgres_data:
